# -----------------------------
# Docker Compose configuration for SRKNote application
# Version 3.8 is used to leverage modern Docker Compose features
# -----------------------------
version: '3.8'

services:

  # -----------------------------
  # PostgreSQL Database Service
  # -----------------------------
  postgres:
    image: postgres:latest                  # Use the latest official PostgreSQL image
    container_name: postgres-container     # Name of the container for easy reference
    environment:                            # Environment variables to initialize the database
      POSTGRES_USER: postgres               # Database username
      POSTGRES_PASSWORD: Demon              # Database password (keep secure)
      POSTGRES_DB: srknotesapp-db           # Name of the database to create
    ports:
      - "5432:5432"                         # Map container's port 5432 to host for local access
    volumes:
      - postgres_data:/var/lib/postgresql/data   # Persist database data in Docker volume

  # -----------------------------
  # SRKNote Backend Service
  # -----------------------------
  backend:
    build:
      context: .                             # Build context pointing to current directory
      dockerfile: Dockerfile                 # Dockerfile to use for building the backend image
    container_name: SRKNote                  # Name of the backend container
    environment:
      - DOTENV=.env                          # Load environment variables from the .env file
    ports:
      - "8000:8000"                          # Map FastAPI backend port 8000 to host
    depends_on:
      - postgres                              # Ensure Postgres service starts before backend

# -----------------------------
# Named volume for PostgreSQL data persistence
# -----------------------------
volumes:
  postgres_data:

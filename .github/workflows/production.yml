# =====================================================
# GitHub Actions Workflow: Deploy SRKNote + Backup
# =====================================================
# Automates deployment of the SRKNote backend and PostgreSQL backup container.
# Trigger: On push to the 'prod' branch.
# Steps:
#   1. Checkout code
#   2. Setup Docker Buildx
#   3. Login to Docker Hub
#   4. Build & push backend image
#   5. Build & push backup image
#   6. Setup SSH access
#   7. Ensure PostgreSQL container exists
#   8. Deploy backend container
#   9. Deploy backup container
#  10. Wait for backend
#  11. Health check
# =====================================================

name: Deploy to Server

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Step 1: Checkout repository
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: prod

      # -----------------------------
      # Step 2: Setup Docker Buildx
      # -----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # -----------------------------
      # Step 3: Login to Docker Hub
      # -----------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------------
      # Step 4: Build & push backend image
      # -----------------------------
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/srknote:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/srknote:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/srknote:buildcache,mode=max

      # -----------------------------
      # Step 5: Build & push backup image
      # -----------------------------
      - name: Build and push backup image
        uses: docker/build-push-action@v4
        with:
          context: ./docker/postgres-backup
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/srknote-backup:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/srknote-backup:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/srknote-backup:buildcache,mode=max

      # -----------------------------
      # Step 6: Setup SSH access
      # -----------------------------
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # -----------------------------
      # Step 7: Ensure PostgreSQL container exists
      # -----------------------------
      - name: Setup PostgreSQL
        env:
          SSH_HOST: 20.199.44.5
          SSH_USER: sagun
          SSH_PORT: 22
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT "
          if ! sudo docker ps -a | grep -q postgres-container; then
            sudo docker run -d \
              --name postgres-container \
              --restart unless-stopped \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=Demon \
              -e POSTGRES_DB=srknotesapp-db \
              -p 5432:5432 \
              -v postgres_data:/var/lib/postgresql/data \
              postgres:latest
          fi
          "

      # -----------------------------
      # Step 8: Deploy backend container
      # -----------------------------
      - name: Deploy backend
        env:
          SSH_HOST: 20.199.44.5
          SSH_USER: sagun
          SSH_PORT: 22
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT "
          echo '${{ secrets.DOCKER_PASSWORD }}' | sudo docker login -u $DOCKER_USERNAME --password-stdin &&
          sudo docker pull $DOCKER_USERNAME/srknote:latest &&
          sudo docker stop SRKNote 2>/dev/null || true &&
          sudo docker rm SRKNote 2>/dev/null || true &&
          sudo docker run -d \
            --name SRKNote \
            --restart unless-stopped \
            --link postgres-container:postgres \
            -e DOTENV=.env \
            -p 8000:8000 \
            $DOCKER_USERNAME/srknote:latest
          "

      # -----------------------------
      # Step 9: Deploy PostgreSQL backup container
      # -----------------------------
      - name: Deploy backup container
        env:
          SSH_HOST: 20.199.44.5
          SSH_USER: sagun
          SSH_PORT: 22
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT "
          if ! sudo docker ps -a | grep -q postgres-backup-container; then
            sudo docker pull $DOCKER_USERNAME/srknote-backup:latest &&
            sudo docker run -d \
              --name postgres-backup-container \
              --restart unless-stopped \
              --link postgres-container:postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=Demon \
              -e POSTGRES_DB=srknotesapp-db \
              -e POSTGRES_HOST=postgres \
              -v $(pwd)/backups:/backups \
              $DOCKER_USERNAME/srknote-backup:latest
          else
            sudo docker stop postgres-backup-container &&
            sudo docker rm postgres-backup-container &&
            sudo docker pull $DOCKER_USERNAME/srknote-backup:latest &&
            sudo docker run -d \
              --name postgres-backup-container \
              --restart unless-stopped \
              --link postgres-container:postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=Demon \
              -e POSTGRES_DB=srknotesapp-db \
              -e POSTGRES_HOST=postgres \
              -v $(pwd)/backups:/backups \
              $DOCKER_USERNAME/srknote-backup:latest
          fi
          "

      # -----------------------------
      # Step 10: Wait for backend
      # -----------------------------
      - name: Wait for backend
        run: sleep 30

      # -----------------------------
      # Step 11: Health check
      # -----------------------------
      - name: Health Check
        env:
          SSH_HOST: 20.199.44.5
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://$SSH_HOST/health)
          if [ $response -eq 200 ]; then
            echo "✅ Backend running"
          else
            echo "❌ Backend not running"
            exit 1
          fi

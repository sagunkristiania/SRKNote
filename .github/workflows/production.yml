# =====================================================
# GitHub Actions Workflow: Deploy SRKNote to Server + Backup
# =====================================================
# Automates deployment of the SRKNote backend and PostgreSQL backup container
# Trigger: On push to the 'prod' branch
# Workflow Steps:
#   1. Checkout repository code
#   2. Set up Docker Buildx
#   3. Login to Docker Hub
#   4. Build and push Docker image
#   5. Set up SSH for remote server access
#   6. Ensure PostgreSQL container exists on server
#   7. Deploy SRKNote backend container
#   8. Deploy PostgreSQL backup container
#   9. Wait for backend to start
#  10. Perform health check to validate deployment
# =====================================================

name: Deploy to Server

on:
  push:
    branches:
      - prod  # Trigger workflow only on pushes to prod branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Step 1: Checkout repository code
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: prod

      # -----------------------------
      # Step 2: Set up Docker Buildx
      # -----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # -----------------------------
      # Step 3: Log in to Docker Hub
      # -----------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------------
      # Step 4: Build and push Docker image
      # -----------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/srknote:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/srknote:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/srknote:buildcache,mode=max

      # -----------------------------
      # Step 5: Set up SSH access
      # -----------------------------
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # -----------------------------
      # Step 6: Ensure PostgreSQL container exists
      # -----------------------------
      - name: Setup PostgreSQL (one-time)
        env:
          SSH_HOST: 20.199.44.5
          SSH_USER: sagun
          SSH_PORT: 22
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT "
          echo 'Checking if PostgreSQL container exists...' &&
          if ! sudo docker ps -a | grep -q postgres-container; then
            echo 'Starting PostgreSQL container...' &&
            sudo docker run -d \
              --name postgres-container \
              --restart unless-stopped \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=Demon \
              -e POSTGRES_DB=srknotesapp-db \
              -p 5432:5432 \
              -v postgres_data:/var/lib/postgresql/data \
              postgres:latest
          else
            echo 'PostgreSQL container already exists, skipping...'
          fi
          "

      # -----------------------------
      # Step 7: Deploy SRKNote backend container
      # -----------------------------
      - name: Deploy backend to server
        env:
          SSH_HOST: 20.199.44.5
          SSH_USER: sagun
          SSH_PORT: 22
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT "
          echo 'Logging into Docker Hub...' &&
          echo '${{ secrets.DOCKER_PASSWORD }}' | sudo docker login -u $DOCKER_USERNAME --password-stdin &&
          echo 'Pulling latest backend image...' &&
          sudo docker pull $DOCKER_USERNAME/srknote:latest &&
          echo 'Stopping existing backend container...' &&
          sudo docker stop SRKNote 2>/dev/null || true &&
          sudo docker rm SRKNote 2>/dev/null || true &&
          echo 'Waiting for port to be released...' &&
          sleep 3 &&
          echo 'Starting new backend container...' &&
          sudo docker run -d \
            --name SRKNote \
            --restart unless-stopped \
            --link postgres-container:postgres \
            -e DOTENV=.env \
            -p 8000:8000 \
            $DOCKER_USERNAME/srknote:latest
          "

      # -----------------------------
      # Step 8: Deploy PostgreSQL backup container
      # -----------------------------
      - name: Deploy PostgreSQL backup container
        env:
          SSH_HOST: 20.199.44.5
          SSH_USER: sagun
          SSH_PORT: 22
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT "
          echo 'Deploying PostgreSQL backup container...' &&
          if ! sudo docker ps -a | grep -q postgres-backup-container; then
            sudo docker run -d \
              --name postgres-backup-container \
              --restart unless-stopped \
              --link postgres-container:postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=Demon \
              -e POSTGRES_DB=srknotesapp-db \
              -e POSTGRES_HOST=postgres \
              -v $(pwd)/backups:/backups \
              $DOCKER_USERNAME/srknote-backup:latest
          else
            echo 'Backup container already exists, restarting...' &&
            sudo docker stop postgres-backup-container &&
            sudo docker rm postgres-backup-container &&
            sudo docker run -d \
              --name postgres-backup-container \
              --restart unless-stopped \
              --link postgres-container:postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=Demon \
              -e POSTGRES_DB=srknotesapp-db \
              -e POSTGRES_HOST=postgres \
              -v $(pwd)/backups:/backups \
              $DOCKER_USERNAME/srknote-backup:latest
          fi
          "

      # -----------------------------
      # Step 9: Wait for backend to start
      # -----------------------------
      - name: Wait for application to start
        run: sleep 30  # Wait 30s to ensure backend is ready

      # -----------------------------
      # Step 10: Perform health check
      # -----------------------------
      - name: Health Check
        env:
          SSH_HOST: 20.199.44.5
        run: |
          echo "Checking application health..."
          response=$(curl -s -o /dev/null -w "%{http_code}" http://$SSH_HOST/health)
          echo $response
          if [ $response -eq 200 ]; then
            echo "✅ Health check passed! Application is running (HTTP $response)"
          else
            echo "❌ Health check failed! HTTP status: $response"
            exit 1
          fi

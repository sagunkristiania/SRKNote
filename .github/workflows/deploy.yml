name: Deploy to Server

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        ref: prod

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/srknote:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/srknote:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/srknote:buildcache,mode=max

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to server
      env:
        SSH_HOST: 20.199.44.5
        SSH_USER: sagun
        SSH_PORT: 22
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      run: |
        ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT "
        whoami &&
        echo 'Logging into Docker Hub...' &&
        echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u $DOCKER_USERNAME --password-stdin &&
        echo 'Pulling latest image...' &&
        docker pull $DOCKER_USERNAME/srknote:latest &&
        echo 'Stopping existing containers...' &&
        docker stop srknote || true &&
        docker rm srknote || true &&
        echo 'Starting new container...' &&
        docker run -d --name srknote -p 80:8000 $DOCKER_USERNAME/srknote:latest
        "

    - name: Wait for application to start
      run: sleep 10

    - name: Health Check
      env:
        SSH_HOST: 20.199.44.5
      run: |
        echo "Checking application health..."
        response=$(curl -s -o /dev/null -w "%{http_code}" http://$SSH_HOST/health)
        
        if [ $response -eq 200 ]; then
          echo "✅ Health check passed! Application is running (HTTP $response)"
        else
          echo "❌ Health check failed! HTTP status: $response"
          exit 1
        fi